# This fixture is deliberately separate from the production source manifest.
# Its purpose is to prevent an accidental manifest mapping change from becoming
# its own expected value.
#
# Before changing an entry:
# 1. Verify the indicator on an official World Bank page/API.
# 2. Confirm that its definition matches the Country Compare metric.
# 3. Update verified_at and keep review_status=verified.

