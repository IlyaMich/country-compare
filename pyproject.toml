[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "country-compare"
version = "1.0.1"
description = "Country comparison and forecasting platform with FastAPI, Streamlit, and optional LLM-assisted predictions."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Ilya Michlin" },
]

license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = [
    "country-comparison",
    "data-analysis",
    "forecasting",
    "fastapi",
    "streamlit",
    "world-bank",
    "data-visualization",
    "llm",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]


dependencies = [
  "pandas>=3.0.2",
  "pyarrow>=23.0.1",
  "PyYAML>=6.0.3",
  "pydantic>=2.13.2",
]

[project.urls]
Homepage = "https://country-compare-ui.onrender.com"
Repository = "https://github.com/IlyaMich/country-compare"
Documentation = "https://github.com/IlyaMich/country-compare/tree/main/docs"
Issues = "https://github.com/IlyaMich/country-compare/issues"
Changelog = "https://github.com/IlyaMich/country-compare/releases"

[project.scripts]
country-compare = "country_compare.cli.main:main"
country-compare-ui = "country_compare.cli.ui:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

charts = [
  "matplotlib>=3.10.8",
]

ml = [
  "scikit-learn>=1.5.0",
]

ui = [
  "streamlit>=1.56.0",
  "httpx>=0.27.0",
  "matplotlib>=3.10.8",
]

dev = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "matplotlib>=3.10.8",
  "streamlit>=1.56.0",
  "pytest>=8.0.0",
  "ruff>=0.3.0",
  "black>=24.0.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["country_compare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "integration: multi-module or filesystem tests",
  "smoke: high-level demo/app smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false